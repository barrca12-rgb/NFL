# Runs the weekly model with live odds and publishes the bet card to GitHub Pages.
# Triggered by the "Update now" button on the site, from the Actions tab, by code changes, or on the schedule below.
name: Update bet card

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = next week)"
        required: false
        default: ""
  push:                     # rebuild the site when the page or model code changes
    branches: [main]
    paths:
      - "model/**.py"
      - "site/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "37 14 * * 2"   # Tuesday 10:37 ET, after Monday night: fresh lines for the new week
    - cron: "37 20 * * 4"   # Thursday 16:37 ET: practice injury report
    - cron: "37 15 * * 0"   # Sunday 11:37 ET: final injury report before kickoff
    - cron: "17 6 * * 5"    # Friday ~2 AM ET: grade Thursday night's game
    - cron: "17 6 * * 1"    # Monday ~2 AM ET: grade Sunday's games
    - cron: "17 6 * * 2"    # Tuesday ~2 AM ET: grade Monday night's game

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-bet-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # queued runs start from the newest commit, not the one that triggered them

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - run: pip install -r model/requirements.txt

      # nflverse play-by-play is large; keep it between runs
      - uses: actions/cache@v4
        with:
          path: model/cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Run the model with live odds
        env:
          SGO_API_KEY: ${{ secrets.ODDS_KEY_NEW }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          WEEK_ARG=""
          if [ -n "${{ github.event.inputs.week }}" ]; then WEEK_ARG="--week ${{ github.event.inputs.week }}"; fi
          python -m model.run_week $WEEK_ARG

      - name: Build site
        run: |
          mkdir -p _site
          cp reports/*.html reports/weeks.json _site/
          CUR=$(python -c "import json; w=json.load(open('reports/weeks.json')); print(f\"{w['season']}_week{w['current']:02d}.html\")")
          cp "reports/$CUR" _site/index.html
          mkdir -p _site/assets && cp site/assets/* _site/assets/   # Off The Glass logo, icons, link-preview image
          touch _site/.nojekyll

      - name: Save report and odds snapshot to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add reports lines bets
          git diff --cached --quiet || git commit -m "Update bet card with live odds ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # another update may have pushed meanwhile: replay this run's results on top (its files win)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
