# Runs the weekly model with live odds and publishes the bet card to GitHub Pages.
# Triggered by the "Update now" button on the site, from the Actions tab, or on the schedule below.
name: Update bet card

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = next week)"
        required: false
        default: ""
  schedule:
    - cron: "37 14 * * 2"   # Tuesday 10:37 ET, after Monday night: fresh lines for the new week
    - cron: "37 20 * * 4"   # Thursday 16:37 ET: practice injury report
    - cron: "37 15 * * 0"   # Sunday 11:37 ET: final injury report before kickoff

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-bet-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - run: pip install -r model/requirements.txt

      # nflverse play-by-play is large; keep it between runs
      - uses: actions/cache@v4
        with:
          path: model/cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Run the model with live odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          WEEK_ARG=""
          if [ -n "${{ github.event.inputs.week }}" ]; then WEEK_ARG="--week ${{ github.event.inputs.week }}"; fi
          python -m model.run_week $WEEK_ARG

      - name: Build site
        run: |
          mkdir -p _site/reports
          cp reports/*.html _site/reports/
          cp "$(ls -t reports/*.html | head -1)" _site/index.html
          touch _site/.nojekyll

      - name: Save report and odds snapshot to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add reports lines
          git diff --cached --quiet || git commit -m "Update bet card with live odds ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin main && git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
